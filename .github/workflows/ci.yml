name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# Actions are pinned to a full commit SHA (audit WL-68): a moved or hijacked tag cannot change what runs.
# To update: pick the release tag, `git ls-remote --tags <repo>` for its commit, replace SHA and comment.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm test
      - run: node tools/build.js --check
  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
      - run: tools/wp-test-site.sh "$RUNNER_TEMP/wp" 8080
      - run: npm install --no-save lighthouse@12.8.2
      - run: node tools/browser-check.js node_modules --all=http://127.0.0.1:8080
      - run: node tools/lighthouse-check.js node_modules/.bin/lighthouse http://127.0.0.1:8080/ http://127.0.0.1:8080/battery/battery-backup-time-calculator/ http://127.0.0.1:8080/load/home-electrical-load-calculator/ http://127.0.0.1:8080/bill/electricity-bill-calculator-pakistan/ http://127.0.0.1:8080/appliances/ http://127.0.0.1:8080/about/
