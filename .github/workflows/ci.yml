name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node tools/build.js --check
  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, sqlite3
      - run: tools/wp-test-site.sh "$RUNNER_TEMP/wp" 8080
      - run: npm install --no-save lighthouse@12.8.2
      - run: node tools/lighthouse-check.js node_modules/.bin/lighthouse http://127.0.0.1:8080/tool-template/ http://127.0.0.1:8080/about/ http://127.0.0.1:8080/privacy-policy/
